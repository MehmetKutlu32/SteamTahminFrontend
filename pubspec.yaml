name: steam_tahmin_frontend
description: "A modern Flutter mobile game: Guess the Game from Steam Reviews."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  provider: ^6.1.2
  confetti: ^0.7.0
  shared_preferences: ^2.5.5
  signalr_netcore: ^1.4.3
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - shorebird.yaml

