<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Tahmin - 1v1 Düello Daveti</title>
    <meta name="description" content="Steam yorumlarından oyunu tahmin et! 1v1 online düelloya davet edildin.">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0b1118;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: linear-gradient(145deg, #131c26, #0e151d);
            border: 1px solid rgba(102, 192, 244, 0.25);
            border-radius: 20px;
            padding: 30px 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
        .logo {
            font-size: 50px;
            margin-bottom: 12px;
        }
        h1 {
            color: #66c0f4;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        p {
            color: #8f98a0;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .code-box {
            background: #172432;
            border: 2px dashed #f59e0b;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 24px;
        }
        .code-title {
            color: #f59e0b;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .code-val {
            color: #ffffff;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: linear-gradient(90deg, #06b6d4, #3b82f6);
            color: #ffffff;
            border: none;
            box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
        }
        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #c7d5e0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .footer {
            font-size: 11px;
            color: #526271;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">⚔️</div>
        <h1>1v1 DÜELLO DAVETİ</h1>
        <p>Steam kullanıcı incelemelerinden oyunu en hızlı tahmin eden maçı kazanır!</p>

        <div class="code-box">
            <div class="code-title">ODA KODU</div>
            <div class="code-val" id="roomCodeDisplay">------</div>
        </div>

        <a id="openAppBtn" href="#" class="btn btn-primary">🎮 OYUNU AÇ & MAÇA GİR</a>
        <a href="https://github.com/MehmetKutlu32/SteamTahminFrontend/releases" class="btn btn-secondary">📲 Oyunu İndir (APK)</a>

        <div class="footer">
            Telefonunda oyun yüklüyse otomatik olarak odaya bağlanır.
        </div>
    </div>

    <script>
        // URL'den room parametresini oku (?room=123456 veya #123456)
        const urlParams = new URLSearchParams(window.location.search);
        let roomCode = urlParams.get('room') || window.location.hash.replace('#', '') || '';

        if (roomCode) {
            document.getElementById('roomCodeDisplay').innerText = roomCode;
            const appUrl = `steamtahmin://duel?room=${roomCode}`;
            document.getElementById('openAppBtn').href = appUrl;

            // Sayfa açıldığında otomatik olarak uygulamayı tetikle
            setTimeout(() => {
                window.location.href = appUrl;
            }, 300);
        } else {
            document.getElementById('roomCodeDisplay').innerText = 'HAZIR';
            document.getElementById('openAppBtn').href = 'steamtahmin://duel';
        }
    </script>
</body>
</html>
